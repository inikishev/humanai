<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HumanAI Model Interface</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="header-bar">
        <h1>HumanAI Model Interface</h1>
        <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle color theme">
            <span class="toggle-icon" id="toggle-icon">&#9790;</span>
            <span id="toggle-label">Dark</span>
        </button>
    </div>
    <div id="tabs-bar" class="tabs-bar"></div>
    <div class="container">
        <div class="panel">
            <h2>Incoming Request</h2>
            <div id="status" class="status idle">Idle. Waiting for CLI request...</div>
            <div class="view-toggle">
                <button id="btn-formatted" class="active" onclick="setReqView('formatted')">Formatted</button>
                <button id="btn-tools" onclick="setReqView('tools')">Available Tools</button>
                <button id="btn-raw" onclick="setReqView('raw')">Raw JSON</button>
            </div>
            <div id="request-formatted" class="request-view"></div>
            <div id="request-tools" class="request-view" style="display:none;"></div>
            <div class="raw-wrap">
                <button type="button" class="copy-btn" onclick="copyEl(this, '#request-payload')">Copy Raw JSON</button>
                <pre id="request-payload" class="request-view" style="display:none;">No request yet.</pre>
            </div>
        </div>
        <div class="panel">
            <h2>Your Response</h2>
            <div class="resp-wrap">
                <div class="resp-tools">
                    <button type="button" class="copy-btn" onclick="copyEl(this, '#response-input')">Copy Response</button>
                    <div class="mode-toggle" id="mode-toggle" style="display:none;">
                        <label><input type="radio" name="resp-mode" value="text" checked onchange="switchMode('text')"><span>Text</span></label>
                        <label><input type="radio" name="resp-mode" value="tool_calls" onchange="switchMode('tool_calls')"><span>Tool Calls</span></label>
                    </div>
                </div>
                <textarea id="response-input" placeholder="Type the assistant's response here..." disabled oninput="if (selectedId !== null && requests[selectedId]) requests[selectedId].responseText = this.value"></textarea>
            </div>
            <div class="tool-call-ui" id="tool-call-ui">
                <div class="param-tool-name">Call a tool</div>
                <select id="tool-select" onchange="onToolSelected()"></select>
                <div id="tool-params"></div>
                <button id="add-tool-btn" class="secondary-btn" onclick="addToolCall()">Add Tool Call</button>
                <div id="tool-call-list"></div>
            </div>
            <button id="submit-btn" onclick="submitResponse()" disabled>Send Response to CLI</button>
            <div id="submit-status"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
